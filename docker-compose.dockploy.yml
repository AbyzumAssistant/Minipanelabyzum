# Dokploy — usa docker-compose.dockploy.yml en Build Type → Docker Compose
#
# DOMINIOS (pestaña Domains, servicio frontend, puerto 4000, HTTPS):
#   1. mccubneuifbu23d.abyzum.com
#   2. mc.abyzum.com
# Tras cambiar dominios: Save → Deploy. Preview Compose debe mostrar labels Traefik.
#
# NO uses labels Traefik manuales aquí (Dokploy los inyecta desde la UI).

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    expose:
      - '8091'
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-2d}
      - ALLOW_INSECURE_AUTH_COOKIES=${ALLOW_INSECURE_AUTH_COOKIES:-false}
      - BASE_DIR=/app
      - COMPOSE_PROJECT=${COMPOSE_PROJECT:-mcabyzum}
      - BASE_PATH=${BASE_PATH:-}
    volumes:
      - ${BASE_DIR:-./data}/servers:/app/servers
      - /var/run/docker.sock:/var/run/docker.sock
      - ${BASE_DIR:-./data}/data:/app/data
    networks:
      - internal
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-}
        BACKEND_PROXY_URL: ${BACKEND_PROXY_URL:-http://backend:8091}
    expose:
      - '4000'
    ports:
      - '4000'
    environment:
      - NODE_ENV=production
      - PORT=4000
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_BACKEND_URL=${NEXT_PUBLIC_BACKEND_URL:-/api/backend}
      - NEXT_PUBLIC_BASE_PATH=${NEXT_PUBLIC_BASE_PATH:-}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - PANEL_URL=${PANEL_URL:-https://mccubneuifbu23d.abyzum.com}
      - LANDING_URL=${LANDING_URL:-https://mc.abyzum.com}
      - PANEL_HOST=${PANEL_HOST:-mccubneuifbu23d.abyzum.com}
      - LANDING_HOST=${LANDING_HOST:-mc.abyzum.com}
      - DEFAULT_LANDING_SERVER=${DEFAULT_LANDING_SERVER:-mcabyzum}
      - NEXT_PUBLIC_LANDING_URL=${NEXT_PUBLIC_LANDING_URL:-https://mc.abyzum.com}
      - COMPOSE_PROJECT=${COMPOSE_PROJECT:-mcabyzum}
      - NEXT_PUBLIC_DEFAULT_LANGUAGE=${NEXT_PUBLIC_DEFAULT_LANGUAGE:-es}
      - NEXT_PUBLIC_MC_SERVER_HOST=${NEXT_PUBLIC_MC_SERVER_HOST:-}
    depends_on:
      - backend
    networks:
      - internal
    restart: unless-stopped

networks:
  internal:
    driver: bridge
