# Dokploy — Compose file: docker-compose.dockploy.yml
# Domains → servicio frontend, puerto contenedor 3000, HTTPS on:
#   mccubneuifbu23d.abyzum.com = panel (/admin)
#   mc.abyzum.com              = landing (/)
# Env: .env.dockploy.example (NO uses FRONTEND_PORT en el host)

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    expose:
      - '8091'
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-2d}
      - ALLOW_INSECURE_AUTH_COOKIES=${ALLOW_INSECURE_AUTH_COOKIES:-false}
      - BASE_DIR=/app
      - COMPOSE_PROJECT=${COMPOSE_PROJECT:-mcabyzum}
      - BASE_PATH=${BASE_PATH:-}
    volumes:
      - ${BASE_DIR:-./data}/servers:/app/servers
      - /var/run/docker.sock:/var/run/docker.sock
      - ${BASE_DIR:-./data}/data:/app/data
    networks:
      - internal
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-}
        BACKEND_PROXY_URL: ${BACKEND_PROXY_URL:-http://backend:8091}
    expose:
      - '3000'
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_BACKEND_URL=${NEXT_PUBLIC_BACKEND_URL:-/api/backend}
      - NEXT_PUBLIC_BASE_PATH=${NEXT_PUBLIC_BASE_PATH:-}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - PANEL_URL=${PANEL_URL:-}
      - LANDING_URL=${LANDING_URL:-}
      - PANEL_HOST=${PANEL_HOST:-}
      - LANDING_HOST=${LANDING_HOST:-}
      - DEFAULT_LANDING_SERVER=${DEFAULT_LANDING_SERVER:-mcabyzum}
      - COMPOSE_PROJECT=${COMPOSE_PROJECT:-mcabyzum}
      - NEXT_PUBLIC_DEFAULT_LANGUAGE=${NEXT_PUBLIC_DEFAULT_LANGUAGE:-es}
      - NEXT_PUBLIC_MC_SERVER_HOST=${NEXT_PUBLIC_MC_SERVER_HOST:-}
    depends_on:
      - backend
    networks:
      - internal
      - dokploy-network
    restart: unless-stopped

networks:
  internal:
    driver: bridge
  dokploy-network:
    external: true
