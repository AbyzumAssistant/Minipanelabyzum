# Dokploy — Compose file: docker-compose.dockploy.yml
# Dominios (HTTPS): mccubneuifbu23d.abyzum.com (panel) + mc.abyzum.com (landing)
# Env: .env.dockploy.example

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    expose:
      - '8091'
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-2d}
      - ALLOW_INSECURE_AUTH_COOKIES=${ALLOW_INSECURE_AUTH_COOKIES:-false}
      - BASE_DIR=/app
      - COMPOSE_PROJECT=${COMPOSE_PROJECT:-mcabyzum}
      - BASE_PATH=${BASE_PATH:-}
    volumes:
      - ${BASE_DIR:-./data}/servers:/app/servers
      - /var/run/docker.sock:/var/run/docker.sock
      - ${BASE_DIR:-./data}/data:/app/data
    networks:
      - dokploy-network
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-}
        BACKEND_PROXY_URL: ${BACKEND_PROXY_URL:-http://backend:8091}
    expose:
      - '3000'
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_BACKEND_URL=${NEXT_PUBLIC_BACKEND_URL:-/api/backend}
      - NEXT_PUBLIC_BASE_PATH=${NEXT_PUBLIC_BASE_PATH:-}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - PANEL_URL=${PANEL_URL:-https://mccubneuifbu23d.abyzum.com}
      - LANDING_URL=${LANDING_URL:-https://mc.abyzum.com}
      - PANEL_HOST=${PANEL_HOST:-mccubneuifbu23d.abyzum.com}
      - LANDING_HOST=${LANDING_HOST:-mc.abyzum.com}
      - DEFAULT_LANDING_SERVER=${DEFAULT_LANDING_SERVER:-mcabyzum}
      - COMPOSE_PROJECT=${COMPOSE_PROJECT:-mcabyzum}
      - NEXT_PUBLIC_DEFAULT_LANGUAGE=${NEXT_PUBLIC_DEFAULT_LANGUAGE:-es}
      - NEXT_PUBLIC_MC_SERVER_HOST=${NEXT_PUBLIC_MC_SERVER_HOST:-}
    depends_on:
      - backend
    networks:
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.services.mcabyzum-frontend.loadbalancer.server.port=3000
      - traefik.http.routers.mcabyzum-panel.rule=Host(`mccubneuifbu23d.abyzum.com`)
      - traefik.http.routers.mcabyzum-panel.entrypoints=websecure
      - traefik.http.routers.mcabyzum-panel.tls.certresolver=letsencrypt
      - traefik.http.routers.mcabyzum-panel.service=mcabyzum-frontend
      - traefik.http.routers.mcabyzum-landing.rule=Host(`mc.abyzum.com`)
      - traefik.http.routers.mcabyzum-landing.entrypoints=websecure
      - traefik.http.routers.mcabyzum-landing.tls.certresolver=letsencrypt
      - traefik.http.routers.mcabyzum-landing.service=mcabyzum-frontend
    restart: unless-stopped

networks:
  dokploy-network:
    external: true
