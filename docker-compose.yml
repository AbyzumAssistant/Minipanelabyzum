# Minipanelabyzum — build local (frontend proxea /api/backend → backend:8091).
# Dockploy: compose file = docker-compose.dockploy.yml (recomendado) o docker-compose.yml
# Domains → servicio frontend, puerto contenedor 3000 (NO hace falta FRONTEND_PORT en el host)

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - '${BACKEND_PORT:-8091}:8091'
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-2d}
      - ALLOW_INSECURE_AUTH_COOKIES=${ALLOW_INSECURE_AUTH_COOKIES:-false}
      - BASE_DIR=/app
      - COMPOSE_PROJECT=${COMPOSE_PROJECT:-mcabyzum}
      - BASE_PATH=${BASE_PATH:-}
    volumes:
      - ${BASE_DIR:-./data}/servers:/app/servers
      - /var/run/docker.sock:/var/run/docker.sock
      - ${BASE_DIR:-./data}/data:/app/data
    networks:
      - minepanel-network
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-}
        BACKEND_PROXY_URL: ${BACKEND_PROXY_URL:-http://backend:8091}
    # Sin ports en el host: Dokploy/Traefik entra por la red Docker al puerto 3000 del contenedor.
    expose:
      - '3000'
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_BACKEND_URL=${NEXT_PUBLIC_BACKEND_URL:-/api/backend}
      - NEXT_PUBLIC_BASE_PATH=${NEXT_PUBLIC_BASE_PATH:-}
      - NEXT_PUBLIC_DEFAULT_LANGUAGE=${NEXT_PUBLIC_DEFAULT_LANGUAGE:-es}
      - NEXT_PUBLIC_MC_SERVER_HOST=${NEXT_PUBLIC_MC_SERVER_HOST:-65.75.202.124}
      - DEFAULT_LANDING_SERVER=${DEFAULT_LANDING_SERVER:-mcabyzum}
      - COMPOSE_PROJECT=${COMPOSE_PROJECT:-mcabyzum}
      - PANEL_URL=${PANEL_URL:-}
      - LANDING_URL=${LANDING_URL:-}
      - PANEL_HOST=${PANEL_HOST:-}
      - LANDING_HOST=${LANDING_HOST:-}
    depends_on:
      - backend
    networks:
      - minepanel-network
    restart: unless-stopped

  # MC Proxy Router - Routes Minecraft Java Edition traffic by hostname (optional)
  # Enable with: docker compose --profile proxy up -d
  mc-router:
    image: itzg/mc-router:1.39.1
    container_name: mc-router
    profiles:
      - proxy
    ports:
      - '${MC_PROXY_PORT:-25565}:25565'
    environment:
      - ROUTES_CONFIG=/data/routes.json
      - ROUTES_CONFIG_WATCH=true
    volumes:
      - ${BASE_DIR:-./data}/data/proxy:/data
    networks:
      - minepanel-network
    restart: unless-stopped

networks:
  minepanel-network:
    name: minepanel-network
    driver: bridge
