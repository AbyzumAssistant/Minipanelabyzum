# Minipanelabyzum — mismo stack Dokploy (+ mc-router opcional: --profile proxy)
# Pestaña Domains VACÍA; routing via labels en frontend.

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    expose:
      - '8091'
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-2d}
      - ALLOW_INSECURE_AUTH_COOKIES=${ALLOW_INSECURE_AUTH_COOKIES:-false}
      - BASE_DIR=/app
      - COMPOSE_PROJECT=${COMPOSE_PROJECT:-mcabyzum}
      - BASE_PATH=${BASE_PATH:-}
    volumes:
      - ${BASE_DIR:-./data}/servers:/app/servers
      - /var/run/docker.sock:/var/run/docker.sock
      - ${BASE_DIR:-./data}/data:/app/data
    networks:
      - internal
      - dokploy-network
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-}
        BACKEND_PROXY_URL: ${BACKEND_PROXY_URL:-http://backend:8091}
    expose:
      - '4000'
    environment:
      - NODE_ENV=production
      - PORT=4000
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_BACKEND_URL=${NEXT_PUBLIC_BACKEND_URL:-/api/backend}
      - NEXT_PUBLIC_BASE_PATH=${NEXT_PUBLIC_BASE_PATH:-}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - PANEL_URL=${PANEL_URL:-https://mccubneuifbu23d.abyzum.com}
      - LANDING_URL=${LANDING_URL:-https://mc.abyzum.com}
      - PANEL_HOST=${PANEL_HOST:-mccubneuifbu23d.abyzum.com}
      - LANDING_HOST=${LANDING_HOST:-mc.abyzum.com}
      - DEFAULT_LANDING_SERVER=${DEFAULT_LANDING_SERVER:-mcabyzum}
      - COMPOSE_PROJECT=${COMPOSE_PROJECT:-mcabyzum}
      - NEXT_PUBLIC_DEFAULT_LANGUAGE=${NEXT_PUBLIC_DEFAULT_LANGUAGE:-es}
      - NEXT_PUBLIC_MC_SERVER_HOST=${NEXT_PUBLIC_MC_SERVER_HOST:-65.75.202.124}
    depends_on:
      - backend
    networks:
      - internal
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.services.mcabyzum-web.loadbalancer.server.port=4000
      - traefik.http.routers.mcabyzum-panel-http.rule=Host(`mccubneuifbu23d.abyzum.com`)
      - traefik.http.routers.mcabyzum-panel-http.entrypoints=web
      - traefik.http.routers.mcabyzum-panel-http.service=mcabyzum-web
      - traefik.http.routers.mcabyzum-panel.rule=Host(`mccubneuifbu23d.abyzum.com`)
      - traefik.http.routers.mcabyzum-panel.entrypoints=websecure
      - traefik.http.routers.mcabyzum-panel.tls.certresolver=letsencrypt
      - traefik.http.routers.mcabyzum-panel.service=mcabyzum-web
      - traefik.http.routers.mcabyzum-landing-http.rule=Host(`mc.abyzum.com`)
      - traefik.http.routers.mcabyzum-landing-http.entrypoints=web
      - traefik.http.routers.mcabyzum-landing-http.service=mcabyzum-web
      - traefik.http.routers.mcabyzum-landing.rule=Host(`mc.abyzum.com`)
      - traefik.http.routers.mcabyzum-landing.entrypoints=websecure
      - traefik.http.routers.mcabyzum-landing.tls.certresolver=letsencrypt
      - traefik.http.routers.mcabyzum-landing.service=mcabyzum-web
    restart: unless-stopped

  mc-router:
    image: itzg/mc-router:1.39.1
    container_name: mc-router
    profiles:
      - proxy
    ports:
      - '${MC_PROXY_PORT:-25565}:25565'
    environment:
      - ROUTES_CONFIG=/data/routes.json
      - ROUTES_CONFIG_WATCH=true
    volumes:
      - ${BASE_DIR:-./data}/data/proxy:/data
    networks:
      - internal
    restart: unless-stopped

networks:
  internal:
    driver: bridge
  dokploy-network:
    external: true
