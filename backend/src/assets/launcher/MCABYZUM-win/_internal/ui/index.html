<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MCABYZUM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Sora:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="noise" aria-hidden="true"></div>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">mcabyzum</span>
    </div>
    <div class="top-meta">
      <span id="version-pill">1.19.2</span>
      <span id="server-pill">servidor</span>
    </div>
  </header>

  <main class="hero">
    <div class="hero-media" aria-hidden="true">
      <img src="hero.png" alt="" />
      <div class="hero-veil"></div>
    </div>

    <div class="hero-copy">
      <p class="brand-lockup">abyzum</p>
      <h1>Minecraft 1.19.2</h1>
      <p class="lede" id="lede">Descarga Java + Minecraft Forge 1.19.2 + login Abyzum. Sin menú vanilla: solo entrar al servidor.</p>

      <label class="field" for="username" id="username-field">
        <span>Nombre en el servidor</span>
        <input id="username" maxlength="16" autocomplete="username" spellcheck="false" />
      </label>
      <p class="remembered" id="remembered-line" hidden>
        Entrando como <strong id="remembered-name"></strong>
        <button type="button" class="linkish" id="change-name">cambiar</button>
      </p>

      <div class="cta-row">
        <button type="button" class="btn btn-primary" id="enter-btn">Entrar</button>
        <button type="button" class="btn btn-ghost" id="repair-btn">Inspeccionar / reparar</button>
      </div>

      <div class="status-block" id="status-block" hidden>
        <p id="status-text">Preparando…</p>
        <div class="bar"><div class="bar-fill" id="bar-fill"></div></div>
        <ul class="inspect-log" id="inspect-log" hidden></ul>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
